name: Deploy Website to GCP Cloud Storage

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Authenticate to Google Cloud using Workload Identity Federation
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/YOUR_GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-sa@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com'

    # Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Sync repository files to the GCS Bucket
    - name: Sync files to Bucket
      run: |
        gcloud storage rsync ./ gs://YOUR_BUCKET_NAME/ --recursive --delete-unmatched-destination-objects -x "\.git.*"